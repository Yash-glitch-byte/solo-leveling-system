<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b2247"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  
  <!-- Outer glowing bracket border -->
  <rect x="36" y="36" width="440" height="440" rx="70" fill="none" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="52" y="52" width="408" height="408" rx="56" fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="24 12"/>

  <!-- Glowing Dagger / System Symbol -->
  <g filter="url(#glow)">
    <!-- Dagger blade -->
    <path d="M256 90 L290 280 L256 340 L222 280 Z" fill="url(#neonCyan)"/>
    <!-- Blade center line -->
    <path d="M256 90 L256 340" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Guard -->
    <path d="M190 330 Q256 350 322 330 L310 355 Q256 370 202 355 Z" fill="#00d2ff"/>
    <!-- Hilt -->
    <rect x="246" y="355" width="20" height="55" rx="3" fill="#0b2247" stroke="#00d2ff" stroke-width="2"/>
    <!-- Pommel -->
    <polygon points="256,430 240,410 272,410" fill="url(#neonCyan)"/>
  </g>

  <!-- System Monogram -->
  <text x="256" y="475" text-anchor="middle" font-family="'Orbitron', monospace, sans-serif" font-weight="900" font-size="28" fill="#00f0ff" letter-spacing="8">SYSTEM</text>
</svg>
